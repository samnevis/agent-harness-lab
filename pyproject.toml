[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-lab"
version = "0.1.0"
description = "A sandbox, grader, and scoreboard for repository coding tasks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sam Khoshnevis" }]
dependencies = [
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ahl = "ahl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ahl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
